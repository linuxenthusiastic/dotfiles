# Varinka - monochrome / black
# Sin matiz: los 16 colores ANSI son una escala de grises ordenada por
# luminosidad, para que rojo (error) siga siendo el mas brillante y azul
# el mas apagado aunque no haya color.

# The basic colors
foreground              #e9ecef
background              #000000
selection_foreground    #000000
selection_background    #adb5bd

# Cursor colors
cursor                  #f8f9fa
cursor_text_color       #000000

# URL underline color when hovering with mouse
url_color               #868e96

# Kitty window border colors
active_border_color     #ced4da
inactive_border_color   #1a1a1a
bell_border_color       #f8f9fa

# Tab bar colors
active_tab_foreground   #000000
active_tab_background   #ced4da
inactive_tab_foreground #6c757d
inactive_tab_background #0d0d0d
tab_bar_background      #000000

# The 16 terminal colors

# black
color0 #1a1a1a
color8 #4a5057

# red -> el mas brillante, para que los errores salten
color1 #f8f9fa
color9 #ffffff

# green
color2  #adb5bd
color10 #c3cad1

# yellow
color3  #dee2e6
color11 #eef1f4

# blue -> el mas apagado
color4  #6c757d
color12 #868e96

# magenta
color5  #ced4da
color13 #e0e4e8

# cyan
color6  #8d959d
color14 #a6adb5

# white
color7  #e9ecef
color15 #ffffff
