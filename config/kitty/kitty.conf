# Cascadia (version Nerd Font) en todos los estilos: su negrita y su cursiva
# tienen el mismo ancho que la regular, asi que calzan en la grilla.
font_family      IosevkaTerm Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 15

cursor_shape block
cursor_stop_blinking_after 0

# estela del cursor
cursor_trail 3
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 0

# permite que nvim apague la estela del terminal mientras esta abierto
allow_remote_control socket-only
listen_on unix:@mykitty
scrollback_lines 2000
copy_on_select yes
mouse_hide_wait 0
select_by_word_characters @-./_~?&=%+#a
enable_audio_bell no
bell_on_tab "🔔 "
remember_window_size  no
window_border_width 1pt
draw_minimal_borders yes
# arriba 4px: el texto queda pegado al techo; los lados siguen con 10
window_padding_width 4 10 10 10
inactive_text_alpha 0.6
hide_window_decorations yes
confirm_os_window_close 0
tab_bar_style powerline


# BEGIN_KITTY_THEME
# Andrea
include current-theme.conf
# END_KITTY_THEME