<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!--
    FiraCodeiScript-Italic.ttf esta mal construida: sus anchos de avance
    oscilan entre 1039 y 1043 unidades (upm 2048) en vez de ser un valor
    unico, asi que fontconfig no le pone spacing=mono (queda vacio =
    proporcional).

    kitty enumera fuentes con all_fonts_map(monospaced=True), o sea que
    descarta cualquier face no monoespaciada. Resultado: la italica ni
    aparecia en su mapa de fuentes y `italic_font Fira Code iScript
    Italic` caia al fallback. Las Regular y Bold si tienen spacing=100,
    por eso esas dos si funcionaban.

    Forzamos el flag en el scan para que kitty la acepte.
    Tras editar este archivo hay que correr: fc-cache -f
  -->
  <match target="scan">
    <test name="family">
      <string>Fira Code iScript</string>
    </test>
    <test name="slant" compare="eq">
      <const>italic</const>
    </test>
    <edit name="spacing" mode="assign">
      <const>mono</const>
    </edit>
  </match>
</fontconfig>
