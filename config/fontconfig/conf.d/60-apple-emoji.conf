<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Apple Color Emoji for emoji only; text and Nerd Font icons keep their own fonts -->
  <alias binding="same">
    <family>emoji</family>
    <prefer><family>Apple Color Emoji</family></prefer>
  </alias>
  <alias binding="same">
    <family>sans-serif</family>
    <prefer><family>Noto Sans CJK JP</family></prefer>
    <accept><family>Apple Color Emoji</family></accept>
  </alias>
  <alias binding="same">
    <family>monospace</family>
    <accept><family>Apple Color Emoji</family></accept>
  </alias>
</fontconfig>
